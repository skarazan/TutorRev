spring.application.name=TutorRev

spring.config.import=optional:file:.env[.properties]

spring.mongodb.database=${MONGODB_DATABASE}
spring.mongodb.uri=${MONGODB_URI}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

youtube.api.key=${YOUTUBE_API_KEY}

frontend.url=${FRONTEND_URL:http://localhost:3000}

spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

server.port=${PORT:8080}

# Trust reverse-proxy headers (Render, Heroku, etc.)
# Without this, Spring sees http:// behind the proxy and generates
# wrong OAuth2 redirect URIs → Google rejects with "redirect_uri_mismatch"
server.forward-headers-strategy=framework

# Email (SMTP) Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true